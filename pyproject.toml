[project]
name = "table-1000"
version = "0.1.0"
description = "Assets and benchmark tasks for robotic tabletop organization"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[project.optional-dependencies]
# Simulation: Isaac Sim 5.1 through the official Isaac Lab release for it.
sim = [
    "isaaclab[isaacsim]==2.3.2.post1",
    "torch==2.7.0",
    "torchvision==0.22.0",
    # Asset physics tests: curves and the solver thread limit.
    "matplotlib==3.10.3",
    "threadpoolctl==3.7.0",
]
# Using robots: kinematics, planning and time parameterization.
robots = ["mplib==0.2.1", "toppra==0.6.10", "trimesh==4.5.1", "rtree==1.3.0"]
# Developing assets and robots: mesh processing, convex decomposition, the asset store.
dev = ["open3d==0.20.0", "coacd==1.0.11", "huggingface_hub==0.36.2", "pytest"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "table_1000"
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Isaac Sim and Isaac Lab wheels are on NVIDIA's index; their dependencies on PyPI.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
